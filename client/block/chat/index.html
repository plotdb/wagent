<div>
  <div class="rc-chat-header">
    <span class="rc-chat-title"></span>
    <span class="rc-chat-meta">
      <label class="rc-chat-autofix" title="關掉的話, 渲染出錯時只會提議, 按了才送給 agent">
        <input type="checkbox" checked><span>出錯自動修</span>
      </label>
      <span class="rc-chat-provider"></span>
      <select class="rc-chat-model" title="模型 ( 下一輪起生效, 對話不清 )" hidden></select>
    </span>
  </div>
  <div class="rc-chat-log"></div>
  <div class="rc-chat-status" hidden></div>
  <div class="rc-chat-input">
    <textarea placeholder="輸入訊息,Enter 送出,Shift+Enter 換行"></textarea>
    <button>送出</button>
  </div>
  <style>
    /* :scope 會被 csscope 換成 scope root 本身的 selector */
    :scope { display: flex; flex-direction: column; height: 100%; }
    .rc-chat-header { padding: 12px 16px; border-bottom: 1px solid #eee; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .rc-chat-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rc-chat-meta { display: flex; align-items: center; gap: 10px; }
    .rc-chat-autofix { font-size: 11px; color: #888; white-space: nowrap; display: flex; align-items: center; gap: 3px; cursor: pointer; user-select: none; }
    .rc-chat-autofix input { margin: 0; cursor: pointer; }
    .rc-chat-provider { font-size: 11px; color: #999; white-space: nowrap; }
    .rc-chat-model { font-size: 11px; color: #555; max-width: 180px; border: 1px solid #ddd; border-radius: 4px; background: #fff; }
    .rc-chat-log { flex: 1; overflow-y: auto; padding: 12px; }
    .rc-msg { margin-bottom: 10px; max-width: 92%; padding: 8px 12px; border-radius: 10px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
    .rc-msg.user { background: #2b6cb0; color: #fff; margin-left: auto; }
    .rc-msg.assistant { background: #f0f0ec; color: #222; }
    .rc-msg.event { background: transparent; color: #888; font-size: 12px; padding: 2px 6px; font-family: Menlo, monospace; }
    .rc-msg.error { background: #fdecea; color: #b3261e; }
    /* markdown 轉譯的訊息 ( base.render ): html 已經有段落, 不再保留換行 */
    .rc-msg.md { white-space: normal; }
    .rc-msg.md > :first-child { margin-top: 0; }
    .rc-msg.md > :last-child { margin-bottom: 0; }
    .rc-msg.md p, .rc-msg.md ul, .rc-msg.md ol, .rc-msg.md pre, .rc-msg.md blockquote, .rc-msg.md table { margin: 0 0 8px; }
    .rc-msg.md ul, .rc-msg.md ol { padding-left: 20px; }
    .rc-msg.md h1, .rc-msg.md h2, .rc-msg.md h3, .rc-msg.md h4 { font-size: 14px; font-weight: 700; margin: 10px 0 6px; }
    .rc-msg.md code { font-family: Menlo, monospace; font-size: 12px; background: rgba(0,0,0,.06); padding: 1px 4px; border-radius: 3px; }
    .rc-msg.md pre { background: rgba(0,0,0,.06); padding: 8px 10px; border-radius: 6px; overflow-x: auto; white-space: pre; }
    .rc-msg.md pre code { background: none; padding: 0; }
    .rc-msg.md blockquote { border-left: 3px solid rgba(0,0,0,.15); padding-left: 10px; color: #555; }
    .rc-msg.md table { border-collapse: collapse; font-size: 12.5px; }
    .rc-msg.md th, .rc-msg.md td { border: 1px solid rgba(0,0,0,.12); padding: 3px 8px; }
    .rc-msg.md a { color: #2b6cb0; }
    .rc-msg.md .wagent-widget.pending { min-height: 24px; border-radius: 6px; background: rgba(0,0,0,.05); }
    /* 排隊中的發話: 已經收下但還沒送進 agent, 用虛線邊框跟已送出的區分 */
    .rc-msg.user.queued { background: transparent; color: #2b6cb0; border: 1px dashed #9dbde0; }
    .rc-msg.offer { background: #fdecea; color: #b3261e; }
    .rc-msg.offer button { margin-top: 6px; display: block; padding: 4px 12px; border: 0; border-radius: 5px; background: #b3261e; color: #fff; cursor: pointer; font-size: 12px; }
    .rc-msg.offer button:disabled { background: #d8a5a0; cursor: default; }
    /* 執行中的狀態列 ( progress 事件 ): 模型 · 正在做什麼 · 送出 / 輸出 token · 經過時間 */
    .rc-chat-status { padding: 4px 12px; font-size: 11.5px; color: #777; font-family: Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 1px solid #f3f3f3; }
    .rc-chat-status .dot { color: #2b6cb0; }
    .rc-chat-status.error .dot { color: #b3261e; }
    .rc-chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #eee; }
    .rc-chat-input textarea { flex: 1; resize: none; height: 60px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13.5px; font-family: inherit; }
    .rc-chat-input button { padding: 0 18px; border: 0; border-radius: 6px; background: #2b6cb0; color: #fff; cursor: pointer; font-size: 14px; }
    .rc-chat-input button:disabled { background: #aaa; }
  </style>
  <!-- chat 預設視覺層: extend chat-base, 以 parent interface 為基礎做 UI。
       用戶可仿此檔 extend chat-base 做自己的視覺。 -->
  <script type="@plotdb/block">
    module.exports = {
      pkg: {
        name: 'chat',
        version: 'main',
        description: 'chat 預設視覺: 訊息列表 + 輸入框 + tool 執行紀錄',
        // bid (name + path), 理由同 sandbox/index.html
        extend: {name: '@plotdb/wagent', path: 'block/chat/base.html', dom: 'overwrite'}
      },
      init: function(opt) {
        var root = opt.root;
        var base = this.base = opt.parent.interface();
        var log = root.querySelector('.rc-chat-log');
        var input = root.querySelector('textarea');
        var btn = root.querySelector('button');
        var title = root.querySelector('.rc-chat-title');
        var providerEl = root.querySelector('.rc-chat-provider');
        var autoFixEl = root.querySelector('.rc-chat-autofix input');
        var modelEl = root.querySelector('.rc-chat-model');
        var thinking = null;
        var statusEl = root.querySelector('.rc-chat-status');
        var queued = [];   // 已經收下、還沒送進 agent 的發話 (畫面上的節點)

        function addMsg(cls, text) {
          var d = document.createElement('div');
          d.className = 'rc-msg ' + cls;
          d.textContent = text;
          log.appendChild(d);
          log.scrollTop = log.scrollHeight;
          return d;
        }

        // busy 期間 status 列固定顯示在最下方: 初始「思考中…」, 有動靜後改「執行中…」,
        // 讓文字段落與 tool 之間的空檔也看得出還在做事
        function working() {
          if(!thinking) { return; }
          thinking.textContent = '執行中…';
          log.appendChild(thinking);
          log.scrollTop = log.scrollHeight;
        }
        base.on('tool', function(ev) {
          var p = ev.input && ev.input.path ? ' ' + ev.input.path : '';
          addMsg('event', (ev.error ? '✗ ' : '✓ ') + ev.tool + p);
          live = null;  // tool 之後的文字另起一則訊息
          working();
        });
        // assistant 的訊息用 base.render 畫 ( markdown 轉譯, 見 base.html 的「訊息格式化」 ).
        // 串流中累積原文 ( src ), 每個 frame 最多重畫一次; 收完整 ( reply ) 再畫一次 final
        var live = null;  // token streaming 中的 assistant 訊息
        var pending = false;
        function paint() {
          pending = false;
          if(live) { base.render(live, live.src); log.scrollTop = log.scrollHeight; }
        }
        base.on('delta', function(t) {
          if(!live) { live = addMsg('assistant md', ''); live.src = ''; }
          live.src += t;
          if(!pending) { pending = true; requestAnimationFrame(paint); }
          working();
        });
        base.on('reply', function(text) {
          var d = live || addMsg('assistant md', '');
          base.render(d, text || '(無回覆)', {final: true});
          live = null;
          log.scrollTop = log.scrollHeight;
        });
        base.on('error', function(e) {
          live = null;
          addMsg('error', '錯誤: ' + e.message);
        });
        base.on('info', function(t) { addMsg('event', t); });
        // 還原之前存的對話 ( base.restore ): 清掉畫面, 依紀錄重畫
        base.on('restore', function(list) {
          log.innerHTML = '';
          live = null;
          list.forEach(function(e) {
            if(e.role === 'user') { addMsg('user', e.text || ''); }
            else if(e.role === 'assistant') { base.render(addMsg('assistant md', ''), e.text || '', {final: true}); }
            else if(e.role === 'tool') { addMsg('event', (e.error ? '✗ ' : '✓ ') + e.tool + (e.path ? ' ' + e.path : '')); }
            else if(e.role === 'error') { addMsg('error', '錯誤: ' + (e.message || '')); }
            else if(e.role === 'info') { addMsg('event', e.text || ''); }
          });
          log.scrollTop = log.scrollHeight;
        });
        base.on('block', function(name) { title.textContent = name; });
        // 執行中也能發話 (會排隊), 所以按鈕不 disable, 只換字提示會進 queue
        base.on('busy', function(b) {
          btn.textContent = b ? '排隊送出' : '送出';
          if(b) { thinking = addMsg('event', '思考中…'); }
          else if(thinking) { thinking.remove(); thinking = null; }
        });
        // ── 狀態列: 顯示最近一份 progress, 每秒重畫經過時間 ──────────────
        var prog = null, ticker = null;
        var VERB = {write_file: '寫入', edit_file: '編輯', read_file: '讀取', run_shell: '執行', snapshot: '截圖'};
        function fmtK(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n || 0); }
        function fmtT(ms) {
          var s = Math.max(0, Math.floor(ms / 1000));
          return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
        }
        function doing(p) {
          if(p.phase === 'waiting') { return '等待回應'; }
          if(p.phase === 'thinking') { return '思考中'; }
          if(p.phase === 'text') { return '回覆中'; }
          if(p.phase === 'tool') { return (VERB[p.tool] || p.tool || 'tool') + (p.target ? ' ' + p.target : ''); }
          if(p.phase === 'error') { return '呼叫失敗'; }
          return '執行工具 / 準備下一步';
        }
        function drawStatus() {
          var p = prog;
          if(!p) { return; }
          var now = Date.now();
          var ended = p.phase === 'done' || p.phase === 'error';
          var out = p.outTokens != null ? fmtK(p.outTokens) : '≈' + fmtK(p.outTokensEst);
          var parts = [
            p.model || p.provider || '',
            doing(p),
            '↑ ' + (p.inEstimated ? '≈' : '') + fmtK(p.inTokens),
            '↓ ' + out + ' tokens',
            fmtT((ended ? p.at : now) - p.startedAt)
          ];
          if(p.turn) { parts.push('本輪 ' + fmtT(now - p.turn.startedAt) + ' · ' + p.turn.calls + ' 次呼叫 · ↓ ≈' + fmtK(p.turn.outTokens)); }
          statusEl.className = 'rc-chat-status' + (p.phase === 'error' ? ' error' : '');
          statusEl.innerHTML = '';
          var dot = document.createElement('span');
          dot.className = 'dot';
          dot.textContent = '● ';
          statusEl.appendChild(dot);
          statusEl.appendChild(document.createTextNode(parts.join(' · ')));
          statusEl.title = statusEl.textContent;
        }
        base.on('progress', function(p) {
          prog = p;
          statusEl.hidden = false;
          drawStatus();
          if(!ticker) { ticker = setInterval(drawStatus, 1000); }
        });
        base.on('busy', function(b) {
          if(b) { return; }
          prog = null;
          statusEl.hidden = true;
          if(ticker) { clearInterval(ticker); ticker = null; }
        });
        base.on('queued', function(text) {
          var el = addMsg('user queued', text);
          el.title = '等 agent 做完手上的事就送進去';
          queued.push(el);
          working();
        });
        // 真的送進去了 — 拿掉「排隊中」的樣式。數量對得上就一則一則拿掉,
        // 對不上 (理論上不會) 就全部清掉, 寧可少一個標記也不要留假的。
        base.on('nudge-taken', function(texts) {
          var n = (texts || []).length;
          var take = n && n <= queued.length ? queued.splice(0, n) : queued.splice(0);
          take.forEach(function(el) {
            el.classList.remove('queued');
            el.title = '';
          });
        });

        // 出錯時的提議: 開關關著、或自動修正試到上限, 就給一顆按鈕
        base.on('fix-offer', function(o) {
          var d = addMsg('offer', (o.reason === 'limit'
            ? '自動修正已達上限,仍然渲染失敗:\n'
            : '渲染失敗:\n') + o.message);
          var b = document.createElement('button');
          b.textContent = '請 agent 修正';
          b.onclick = function() {
            b.disabled = true;
            b.textContent = '已送出';
            addMsg('event', '已把錯誤送給 agent');
            o.fix();
          };
          d.appendChild(b);
          log.scrollTop = log.scrollHeight;
        });

        function send() {
          var text = input.value.trim();
          if(!text) { return; }
          input.value = '';
          // 執行中的話 base.send 會轉成排隊, 並發 'queued' — 那則訊息由該
          // handler 畫, 這裡不能先畫, 否則同一句會出現兩次。
          if(!base.busy()) { addMsg('user', text); }
          base.send(text).catch(function() {});  // 錯誤已由 error handler 顯示
        }
        btn.onclick = send;
        input.addEventListener('keydown', function(e) {
          if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });

        title.textContent = base.block() || '新增 block';
        addMsg('assistant', base.block()
          ? '正在編輯「' + base.block() + '」。告訴我你要怎麼修改。'
          : '描述你想要的 block,我會建立一個新的。例如:「用 sales 資料畫營收折線圖」。');
        autoFixEl.checked = base.autoFix();
        autoFixEl.addEventListener('change', function() {
          base.autoFix(autoFixEl.checked);
          addMsg('event', autoFixEl.checked ? '出錯時會自動請 agent 修' : '出錯時只會提議,按了才送');
        });
        var models = base.models && base.models();
        if(models) {
          // 選項的 value 是 "provider/model"; model 名稱本身不含 "/"
          var pick = function(c) { if(c) { modelEl.value = c.provider + '/' + c.model; } };
          models.listModels().then(function(r) {
            var names = Object.keys(r.providers || {});
            if(!names.length) { providerEl.textContent = '未設定 API key (.env)'; return; }
            names.forEach(function(name) {
              var g = document.createElement('optgroup');
              g.label = name;
              (r.providers[name].models || []).forEach(function(m) {
                var o = document.createElement('option');
                o.value = name + '/' + m;
                o.textContent = m;
                g.appendChild(o);
              });
              modelEl.appendChild(g);
            });
            modelEl.hidden = false;
            pick(r.current);
          });
          modelEl.addEventListener('change', function() {
            var v = modelEl.value.split('/');
            models.setModel({provider: v[0], model: v.slice(1).join('/')})
              .then(function(c) { addMsg('event', '下一輪起使用 ' + c.provider + ' / ' + c.model); })
              .catch(function(e) {
                addMsg('error', '換模型失敗: ' + ((e && e.message) || e));
                models.getModel().then(pick);
              });
          });
          models.onModelChange(pick);
        } else {
          base.provider().then(function(j) {
            providerEl.textContent = j.provider ? j.provider + ' / ' + j.model : '未設定 API key (.env)';
          });
        }
        input.focus();
      },
      interface: function() { return this.base; }
    };
  </script>
</div>
