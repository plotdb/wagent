<div>
  <!-- chat base 層: headless, 只有邏輯。視覺由 extend 此 block 的 derived 層實作。 -->
  <script type="@plotdb/block">
    module.exports = {
      pkg: {
        name: 'chat-base',
        version: 'main',
        description: 'chat 邏輯層: 對話 api 溝通、事件廣播 (不決定畫面)'
      },
      init: function(opt) {
        var d = opt.data || {};
        this.api = d.api || '/api/agent';
        this.blockName = d.block || null;
        this.session = d.session || ('draft-' + Math.random().toString(36).slice(2, 10));
        this.sandbox = d.sandbox || null;
        // d.transport: browser runtime 注入 ({send(text, cb), reset()})。必要 —
        // agent loop 在本機 worker 裡, chat 只是它的介面層。
        this.transport = d.transport || null;
        // d.models: 選用, 有 listModels / setModel / onModelChange 的物件 (通常就是 runtime)。
        // 給了, 畫面就能讓使用者在對話中換模型。
        this.models = d.models || null;
        // 渲染錯誤自動修正: 只修 LLM 剛寫的 block, 同一輪最多 maxFix 次,
        // 成功渲染或用戶手動發話即歸零。data.autoFix = false 可關閉。
        this.autoFix = d.autoFix !== false;
        this.maxFix = d.maxFix || 2;
        this.fixCount = 0;
        // 提議的節流。render-error 是**每次重繪**都會來一次的訊號, 而到達上限之後
        // 我們不再自己動手, 只提議 —— 少了節流, 同一個錯誤會一張一張堆滿對話框,
        // 而且每一張都長得一樣。實測: 一個面板的 bug 讓同樣的提議出現了四次。
        //   offered  上一張還沒被處理的提議是哪一個錯 (name + message)
        //   offers   自上次成功渲染以來提議過幾次 —— 擋的是「每次訊息都不一樣」
        //            的遞迴錯誤, 那種 dedup 攔不住。
        this.offered = null;
        this.offers = 0;
        this.maxOffer = d.maxOffer || 3;
        this.wrote = false;      // 這一輪 agent 有沒有寫過檔 (自動修正的 safe guard)
        this.busy = false;       // 正在跑 — 決定發話要開新的一輪還是插隊
        this.turn = null;        // 本輪 ( 一次 send ) 的累計, 給 progress 事件用
        this.handlers = {};
      },
      interface: function() {
        var self = this;
        if(this.itf) { return this.itf; }
        function emit(ev, data) {
          (self.handlers[ev] || []).forEach(function(fn) { fn(data); });
        }
        // chat 不決定畫面。「什麼時候該重畫」屬於 application —
        // 只有它知道現在畫的是什麼、編輯範圍到哪, 而且變更的來源不只 agent
        // (使用者的終端機、頁面上的 codemirror 都算)。改由 host 的 fs 變更事件驅動。
        //
        // 這裡只記「這一輪 agent 到底有沒有寫過東西」, 供自動修正的 safe guard 用。
        // 那是對話層的知識, 不需要知道任何路徑慣例。
        function noteWrite(ev) {
          if((ev.tool === 'write_file' || ev.tool === 'edit_file') && !ev.error) {
            self.wrote = true;
          }
        }
        // ── progress 事件 ───────────────────────────────────────────────
        // runtime 每次 LLM 呼叫的進度 ( 欄位定義見 client/runtime/progress.js ), 這裡原樣轉出,
        // 再加上本輪的累計 turn。已在 worker 端節流 ( 最多約每 250ms 一則, phase 改變時立即 )。
        //
        //   on('progress', function(p) { ... })
        //   p.provider / p.model   本次呼叫的模型
        //   p.step                 本輪第幾次呼叫 ( 插話接著跑的那段會從 1 重新起算 )
        //   p.phase                'waiting' | 'thinking' | 'text' | 'tool' | 'done' | 'error'
        //   p.tool / p.target      phase 為 tool 時的工具名稱 / 參數裡的 path ( 抓得到才有 )
        //   p.outChars             本次呼叫累積的輸出字元數 ( text + thinking + tool 參數 )
        //   p.outTokensEst         輸出 token 估計值;  p.outTokens: done 時 API 回報的實際值
        //   p.inTokens             送出量 token;  p.inEstimated 為 true 表示還是估計值
        //   p.inDetail             實際值的拆分 {input, cacheRead, cacheWrite} ( 合計 = inTokens )
        //   p.usage / p.stopReason done 時附上;  p.error: phase 為 error 時的訊息
        //   p.startedAt / p.at     本次呼叫開始 / 這份快照的時間 ( ms )
        //   p.turn                 本輪累計 {startedAt, calls, outTokens, inTokens}:
        //                          outTokens = 已結束呼叫的實際值 ( 沒有就用估計 ) + 進行中這次的估計
        //                          inTokens  = 各次呼叫送出量的合計 ( 快取讀取也算在內 )
        //
        // 經過時間由畫面自己以 startedAt 計 ( 事件只在有輸出時才來 )。這輪結束時沒有特別的
        // progress 事件 —— 以 busy(false) 為準收掉顯示。進度不進對話歷史。
        function onProgress(p) {
          var t = self.turn;
          if(!t || !p) { return; }
          if(p.phase === 'waiting' && t.cur !== p.startedAt) { t.cur = p.startedAt; t.calls++; }
          var out = p.outTokens != null ? p.outTokens : (p.outTokensEst || 0);
          var ended = p.phase === 'done' || p.phase === 'error';
          if(ended) { t.outDone += out; t.inDone += p.inTokens || 0; t.cur = null; }
          emit('progress', Object.assign({}, p, {
            turn: {
              startedAt: t.startedAt,
              calls: t.calls,
              outTokens: t.outDone + (ended ? 0 : out),
              inTokens: t.inDone + (ended ? 0 : (p.inTokens || 0))
            }
          }));
        }
        this.itf = {
          on: function(ev, fn) {
            (self.handlers[ev] = self.handlers[ev] || []).push(fn);
            return self.itf;
          },
          block: function() { return self.blockName; },
          // 正在跑嗎 — 畫面靠它決定發話會不會變成排隊
          busy: function() { return self.busy; },
          // 自動修正的開關。預設開 = 出錯就讓 agent 自己修; 關 = 只提議,
          // 使用者按了才送。這決定「什麼時候花錢、什麼時候讓 agent 動手」,
          // 所以是使用者的選擇, 不是我們的預設值。
          autoFix: function(v) {
            if(v === undefined) { return self.autoFix; }
            self.autoFix = !!v;
            emit('auto-fix', self.autoFix);
            return self.autoFix;
          },
          setBlock: function(name) {
            self.blockName = name;
            emit('block', name);
          },
          // 正在跑的時候發話不開新的一輪, 排進 queue 讓當下這一輪帶走。
          // 判斷放這裡而不是丟給 UI: 「現在是不是在跑」是對話層的事實。
          send: function(text, o) {
            if(self.busy) {
              self.transport && self.transport.nudge(text);
              emit('queued', text);
              return Promise.resolve({queued: true});
            }
            if(!(o && o.auto)) {   // 用戶手動發話, 歸零
              self.fixCount = 0; self.wrote = false;
              self.offered = null; self.offers = 0;
            }
            self.busy = true;
            self.turn = {startedAt: Date.now(), calls: 0, cur: null, outDone: 0, inDone: 0};
            emit('busy', true);
            // agent loop 在本機 worker; transport 由 runtime 注入 (createRuntime().transport)
            if(!self.transport) {
              return Promise.reject(new Error('chat: 缺少 transport — 用 createRuntime() 取得後傳進來'));
            }
            return self.transport.send(text, {
                block: self.blockName,
                session: self.blockName || self.session,
                onDelta: function(t) { emit('delta', t); },
                // start 用來顯示「正在做什麼」; end 只在失敗時再發一則 (顯示成 ✗)。
                // 兩段都發的話, 視覺層會每個 tool 畫兩行。
                onTool: function(ev) {
                  if(ev.phase !== 'end') { return emit('tool', ev); }
                  noteWrite(ev);
                  if(ev.error) { emit('tool', ev); }
                },
                // 排隊的訊息真的送進去了 — 讓畫面把「排隊中」改掉
                onNudge: function(texts) { emit('nudge-taken', texts); },
                onProgress: onProgress
              })
                .then(function(j) {
                  self.busy = false;
                  self.turn = null;
                  emit('reply', j.reply || '');
                  emit('busy', false);
                  return j;
                })
                .catch(function(e) {
                  self.busy = false;
                  self.turn = null;
                  emit('busy', false);
                  emit('error', e);
                  throw e;
                });
          },
          reset: function() {
            if(self.transport) { self.transport.reset(self.blockName || self.session); }
            return Promise.resolve({ok: true});
          },
          provider: function() {
            return fetch(self.api + '/provider').then(function(r) { return r.json(); });
          },
          models: function() { return self.models; }
        };
        // 渲染錯誤自動修正 (帶 safe guard, 見 init 註解)
        if(this.sandbox && this.sandbox.on) {
          this.sandbox.on('rendered', function(name) {
            if(name === self.blockName) {
              self.fixCount = 0; self.offered = null; self.offers = 0;
            }
          });
          this.sandbox.on('render-error', function(o) {
            // 只碰 agent 這一輪真的寫過、而且是目前編輯對象的 block —
            // 否則使用者打開一個本來就壞掉的 block, agent 會自作主張去改它。
            // 這是 safe guard 不是偏好設定, 所以不受 autoFix 開關影響。
            if(!self.wrote || o.name !== self.blockName) { return; }
            var fix = function() {
              self.fixCount++;
              self.offered = null;   // 送出去了, 之後再壞就是新的一件事
              return self.itf.send(
                '前端渲染 block「' + o.name + '」時發生錯誤:\n' + o.message +
                '\n請 read_file 檢查並修正這個 block。',
                {auto: true}
              ).catch(function() {});
            };
            // 提議而不是逕自去修: 開關關著, 或自動修正已經試到上限。
            // 兩種情況都給使用者同一個出口 — 一顆按鈕, 按了才送。
            if(!self.autoFix || self.fixCount >= self.maxFix) {
              var key = o.name + '\n' + o.message;
              if(self.offered === key) { return; }        // 同一個錯, 只講一次
              if(self.offers >= self.maxOffer) {
                // 每次都是新訊息的遞迴錯誤。再往下貼只是把對話框洗掉, 使用者
                // 反而看不到最早的那一個 —— 停在這裡, 說一聲就好。
                if(self.offers === self.maxOffer) {
                  self.offers++;
                  emit('info', '渲染持續失敗且錯誤一直在變, 已停止提議 —— 請重新整理或自己看一下。');
                }
                return;
              }
              self.offers++;
              self.offered = key;
              emit('fix-offer', {
                name: o.name,
                message: o.message,
                reason: self.autoFix ? 'limit' : 'off',
                fix: fix
              });
              return;
            }
            emit('info', '渲染錯誤,嘗試自動修正 (' + (self.fixCount + 1) + '/' + self.maxFix + ')');
            fix();
          });
        }
        return this.itf;
      }
    };
  </script>
</div>
