<div>
  <!-- sandbox base 層: headless, 負責載入並執行 workspace block, 對外提供操作 api。 -->
  <script type="@plotdb/block">
    module.exports = {
      pkg: {
        name: 'sandbox-base',
        version: 'main',
        description: 'sandbox 邏輯層: 執行 workspace block、提供操作 api'
      },
      init: function(opt) {
        var d = opt.data || {};
        this.api = d.api || '/api/agent';
        this.ws = d.workspace || '/workspace';
        // d.io: browser runtime 注入 (loadText / loadJSON);
        // 不給則走 server 模式, 以 URL 取 workspace 檔案
        var ws = this.ws;
        this.io = d.io || {
          loadText: function(p) {
            return fetch(ws + '/' + p + '?t=' + Date.now()).then(function(r) {
              if(!r.ok) { throw new Error('load failed: ' + p); }
              return r.text();
            });
          },
          loadJSON: function(p) {
            return fetch(ws + '/' + p).then(function(r) {
              if(!r.ok) { throw new Error('load failed: ' + p); }
              return r.json();
            });
          }
        };
        // snapdom: 出圖的泛用路徑 (DOM -> 圖)。canvas / svg / shadow DOM 它自己會處理,
        // 所以 Chart.js 與 d3 都不必特別對待。只在需要出圖時才動態載入。
        this.snapdomUrl = d.snapdom || '/assets/lib/@zumer/snapdom/main/dist/snapdom.mjs';
        // d.source: function(name) -> (Promise of) block 原始碼。應用層的窗口 —
        // 「名字怎麼對應到檔案」是應用的目錄約定 (單一 block 的應用就是 /index.html,
        // 多 block 的才有 blocks/<name>/index.html)。不給就把 name 當成路徑直接讀。
        var io = this.io;
        this.source = typeof d.source === 'function' ? d.source : function(n) { return io.loadText(n); };
        // d.list: function() -> (Promise of) [{name, description}]。同樣是應用層的窗口 —
        // 「有哪些可切換的東西」要知道目錄約定, 而單一 block 的應用根本沒有清單可列。
        // 不給就是空清單, 視覺層會把切換選單收起來。
        this.list = typeof d.list === 'function' ? d.list : function() { return []; };
        // d.data: function(blockName) -> (Promise of) 要交給 block 的 opt.data。
        // 這是應用層的窗口 — 資料的語意屬於應用, wagent 對它的內容一無所知。
        // 不給就是空的; block 拿不到任何東西也應該能跑。
        this.data = typeof d.data === 'function' ? d.data : null;
        // d.adapt: function(itf, value) -> 掛好之後、以及資料變動時呼叫, 由應用層
        // 拿 block 自己的 interface 把資料餵進去。不給就走 opt.data + client.data。
        // 為什麼需要這一條: 見下方 adaptData。
        this.adapt = typeof d.adapt === 'function' ? d.adapt : null;
        this.imageWidth = d.imageWidth || 800;   // 送進 LLM 的圖寬, 直接對應 token 成本
        this.captureTimeout = d.captureTimeout || 6000;
        this.snapdom = null;
        this.current = null;
        this.el = null;         // 上次渲染的容器, snapshot 的對象
        this.inst = null;       // 上次渲染的 block instance (取 client 用)
        this.rendering = null;  // 進行中的渲染 promise, snapshot 要等它
        this.lastError = null;
        this.sigs = {};         // 各 snapshot 情境的上次簽名, 用來算差異量
        this.handlers = {};
        // 視覺層的語言與字串覆寫 ( 見 index.html )。給 agent 的 snapshot 報告是固定的英文欄位, 不受影響
        this.lang = d.lang || 'zh';
        this.strings = d.strings || {};
      },
      interface: function() {
        var self = this;
        if(this.itf) { return this.itf; }
        // 這個 sandbox 作為 host 的識別碼。block 若在 pkg.host 宣告它,
        // 就能在 client() 回報 capture / pause / seek / state 等能力 (全部選用)。
        var HOST_BID = '@plotdb/wagent';
        // 等渲染的上限, 見 atMost
        var RENDER_WAIT = 3000;

        function emit(ev, data) {
          (self.handlers[ev] || []).forEach(function(fn) { fn(data); });
        }

        // ── host / client ────────────────────────────────────────────────
        // host -> client: 提供給 block 的服務
        function hostObject() {
          return {
            bid: HOST_BID,
            interface: function() {
              return {
                loadText: self.io.loadText,
                loadJSON: self.io.loadJSON,
                mode: 'edit'
              };
            }
          };
        }

        // client -> host: block 自報的選用能力。沒宣告 host、沒實作 client 都是正常情況,
        // 一律 fallback 到 host 自己的泛用做法 (snapdom 出圖)。
        function clientOf(inst) {
          if(!inst || typeof inst.client !== 'function') { return null; }
          try {
            var c = inst.client({bid: HOST_BID});
            return (c && typeof c === 'object') ? c : null;
          } catch(e) { return null; }
        }

        function callClient(c, name, arg) {
          if(!c || typeof c[name] !== 'function') { return Promise.resolve(null); }
          return Promise.resolve()
            .then(function() { return c[name](arg); })
            .catch(function(e) { return {error: String((e && e.message) || e)}; });
        }

        var CLIENT_CAPS = ['data', 'pause', 'seek', 'state', 'capture'];
        function capsOf(c) {
          if(!c) { return []; }
          return CLIENT_CAPS.filter(function(k) { return typeof c[k] === 'function'; });
        }

        // 把「要求了什麼、實際生效了什麼」寫進報告。少了這段, block 沒實作 seek 時
        // 拿到的只是一張隨機的動畫影格, 而 agent 會以為自己看到的是 t=3。
        function clientReport(report, c, o) {
          var caps = capsOf(c);
          // 也講明資料是怎麼進 block 的。不講的話, 走 adapt 的應用會讓 agent 看到
          // 「implements 是空的」卻又畫得出東西, 而它對看不懂的狀況會編故事。
          report.client = {implements: caps, dataVia: self.adapt ? 'adapt' : 'opt.data'};
          if(o.time == null) { return; }
          report.client.seek = caps.indexOf('seek') >= 0 ? o.time : false;
          var hint = null;
          if(caps.indexOf('seek') < 0) {
            hint = 'you asked for time: ' + o.time + ' but this block does not implement seek — ' +
              'the frame you got is whatever was on screen, NOT time ' + o.time + '. ' +
              'add pause / seek to the block client if you need reproducible frames.';
          } else if(caps.indexOf('pause') < 0) {
            hint = 'this block implements seek but not pause — it may keep animating after the seek, ' +
              'so repeated snapshots at the same time can still differ.';
          }
          // inspect 可能已經放了 blank 之類的 hint, 別蓋掉
          if(hint) { report.hint = report.hint ? report.hint + ' ' + hint : hint; }
        }

        // ── 取樣與出圖 ────────────────────────────────────────────────────
        // canvas 取樣: 縮到 N x N 讀像素, 得到 (a) 有沒有東西 (b) 一個可比較的簽名。
        // 對 WebGL canvas, 若未開 preserveDrawingBuffer 會讀到全透明 — 這是常見坑, 另外提示。
        var N = 32;
        function sampleCanvas(canvas) {
          try {
            var c = document.createElement('canvas');
            c.width = c.height = N;
            var ctx = c.getContext('2d');
            ctx.drawImage(canvas, 0, 0, N, N);
            var d = ctx.getImageData(0, 0, N, N).data;
            var cells = [];
            var lit = 0;
            var seen = {};
            for(var i = 0; i < N * N; i++) {
              var a = d[i * 4 + 3];
              var v = a ? Math.round((d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11) / 32) : -1;
              if(a) { lit++; }
              seen[v] = 1;
              cells.push(v);
            }
            var keys = Object.keys(seen);
            return {
              ratio: lit / (N * N), levels: keys.length, cells: cells.join(','),
              // 只有一種顏色時, 這色是什麼很重要: 全透明 / 全白 是「沒畫東西」,
              // 純色填滿則是畫了東西, 兩者不能都算 blank
              flat: keys.length === 1 ? +keys[0] : null
            };
          } catch(e) {
            return null;   // 跨來源圖片汙染等
          }
        }

        function withTimeout(p, ms, msg) {
          return Promise.race([
            p,
            new Promise(function(_, rej) { setTimeout(function() { rej(new Error(msg)); }, ms); })
          ]);
        }

        function canvasToImage(canvas) {
          var url = canvas.toDataURL('image/jpeg', 0.8);
          return {
            mediaType: 'image/jpeg',
            data: url.slice(url.indexOf(',') + 1),
            width: canvas.width, height: canvas.height
          };
        }

        // block 自報的 capture 可以回 canvas / blob / dataURL, 統一轉成 {mediaType, data}
        function normalizeImage(v) {
          if(!v) { return null; }
          if(v.mediaType && v.data) { return v; }
          if(typeof HTMLCanvasElement !== 'undefined' && v instanceof HTMLCanvasElement) {
            return canvasToImage(v);
          }
          if(typeof v === 'string' && v.slice(0, 5) === 'data:') {
            var i = v.indexOf(',');
            return {mediaType: v.slice(5, v.indexOf(';')), data: v.slice(i + 1)};
          }
          if(typeof Blob !== 'undefined' && v instanceof Blob) {
            return new Promise(function(res, rej) {
              var fr = new FileReader();
              fr.onload = function() {
                var u = String(fr.result);
                res({mediaType: v.type || 'image/png', data: u.slice(u.indexOf(',') + 1)});
              };
              fr.onerror = function() { rej(new Error('failed to read captured blob')); };
              fr.readAsDataURL(v);
            });
          }
          return null;
        }

        // 出圖: 先問 block 自己 (它最知道怎麼截, 例如 WebGL 直接 readPixels),
        // 沒有就用 snapdom 重繪 DOM -> canvas -> jpeg。
        function capture(el, inst) {
          if(!el) { return Promise.resolve(null); }
          var c = clientOf(inst);
          var own = (c && typeof c.capture === 'function')
            ? withTimeout(
                Promise.resolve().then(function() { return c.capture({width: self.imageWidth}); }),
                self.captureTimeout, 'the block\'s own capture() timed out'
              ).then(normalizeImage)
            : Promise.resolve(null);

          return own.then(function(img) {
            if(img) { return img; }
            var load = self.snapdom ? Promise.resolve(self.snapdom) : import(self.snapdomUrl)
              .then(function(m) { return (self.snapdom = m.snapdom || m.default); });
            return load
              .then(function(snapdom) {
                // snapdom 需要 renderer 有在出 frame (它會等 image decode);
                // 分頁被丟到背景時 Chrome 會凍結整條 pipeline, 這裡就會無限等 —
                // 所以一定要有 timeout, 否則整個 tool call 卡住。
                return withTimeout(
                  snapdom.toCanvas(el, {
                    width: self.imageWidth, dpr: 1, backgroundColor: '#ffffff', fast: true
                  }),
                  self.captureTimeout,
                  'image capture timed out — the page is probably in a background tab. the text report above is still valid.'
                );
              })
              .then(canvasToImage);
          });
        }

        // ── 觀察 ──────────────────────────────────────────────────────────
        function inspect(el, sigKey, name, env) {
          if(!el) {
            return {block: name, rendered: false, note: 'nothing has been rendered yet'};
          }
          var box = el.getBoundingClientRect();
          var r = {
            block: name,
            rendered: !self.lastError,
            size: {width: Math.round(box.width), height: Math.round(box.height)},
            elements: el.querySelectorAll('*').length
          };
          if(self.lastError) { r.error = self.lastError; }
          var text = (el.innerText || '').replace(/\s+/g, ' ').trim();
          if(text) { r.text = text.length > 300 ? text.slice(0, 300) + '…' : text; }

          var canvases = el.querySelectorAll('canvas');
          var svgs = el.querySelectorAll('svg');
          var sig = null;
          var blank = null;

          if(canvases.length) {
            var s = sampleCanvas(canvases[0]);
            r.canvas = {count: canvases.length};
            if(!s) {
              r.canvas.note = 'canvas could not be sampled (tainted by cross-origin content?)';
            } else {
              r.canvas.inkRatio = +s.ratio.toFixed(3);
              r.canvas.levels = s.levels;
              sig = s.cells;
              // 單一色階: 只有透明或接近全白才算空白 (v 是 0..7 的亮度桶, -1 為透明)
              var empty = s.flat === -1 || s.flat >= 7;
              blank = s.ratio < 0.01 || (s.levels <= 1 && empty);
              if(s.levels <= 1 && !blank) {
                r.canvas.uniform = true;
                r.canvas.note = 'canvas is filled with a single flat colour — something was drawn, but there is no detail. if you expected shapes or text, they are missing.';
              }
              if(s.ratio < 0.01) {
                r.canvas.note = 'canvas reads as empty. if this is WebGL, create the context with {preserveDrawingBuffer: true} — otherwise the drawing buffer is cleared before it can be read.';
              }
            }
          }
          if(svgs.length) {
            var shapes = svgs[0].querySelectorAll('path,rect,circle,ellipse,line,polyline,polygon,image,use');
            var labels = svgs[0].querySelectorAll('text');
            r.svg = {count: svgs.length, shapes: shapes.length, texts: labels.length};
            if(blank === null) { blank = !shapes.length; }
            if(sig === null) { sig = 'svg:' + shapes.length + ':' + labels.length; }
          }
          if(blank === null) {
            blank = r.elements < 2 && !text;
          }
          if(sig === null) {
            sig = 'dom:' + r.elements + ':' + text.slice(0, 120);
          }
          if(env && env.settled === false) {
            r.stillChanging = true;
            r.hint = (r.hint ? r.hint + ' ' : '') +
              'the picture was still changing when sampled — it did not settle within the budget. ' +
              'treat changedRatio as unreliable here; for animations use pause / seek for a reproducible frame.';
          }
          r.blank = blank;
          // block 根本沒跑起來時, 畫面當然是空的 — 這時給「容器沒高度」「資料沒進到繪圖」
          // 這種提示只會把 agent 帶去修一個不存在的問題。錯誤本身才是唯一該看的東西。
          if(r.error) {
            r.hint = 'the block threw before it could render — fix the error above. ' +
              'everything else in this report is a consequence of that, not a separate problem.';
          } else if(!box.width || !box.height) {
            r.hint = 'the container has zero width or height — give the block\'s outer wrapper an explicit size.';
          } else if(blank) {
            // 空白有三種來源, 只有第三種是 block 的問題。分不清楚的話 agent 會去修
            // 一個不存在的 bug —— 而它有寫入權。
            r.hint = (env && env.rafFired === false)
              ? 'the page is in a background tab so the browser froze its rendering pipeline — anything drawn via requestAnimationFrame (Chart.js animations, games) has not painted yet. this is very likely NOT a bug in the block; do not "fix" it based on this. ask the user to bring the tab to the front if you need to see it.'
              : (env && env.settled === false)
              ? 'the picture had not settled when sampled — it may simply still be appearing (a fade-in, or data still loading), not broken. this is NOT evidence of a bug: take another snapshot before concluding anything, and do not change data or code based on this one. if a second snapshot looks exactly the same, then it really is empty and the data path is worth investigating.'
              : 'the block rendered without throwing but looks empty — check the data actually reached the drawing code, and that the container has a non-zero size.';
          }

          // 與上次同情境 snapshot 的差異量: 判斷「這次改動到底有沒有讓畫面變」。
          // 分情境記 (live / 各種尺寸的 fresh), 不同尺寸互相比較沒有意義。
          var last = self.sigs[sigKey];
          if(last != null) {
            r.changedSinceLast = sig !== last;
            if(sig.indexOf(',') >= 0 && last.indexOf(',') >= 0) {
              var a = sig.split(','), b = last.split(',');
              if(a.length === b.length) {
                var n = 0;
                for(var i = 0; i < a.length; i++) { if(a[i] !== b[i]) { n++; } }
                r.changedRatio = +(n / a.length).toFixed(3);
              }
            }
          }
          self.sigs[sigKey] = sig;
          return r;
        }

        // 等畫面繪完: 兩個 frame + timeout 保底。
        // 分頁在背景時 rAF 不會觸發, 沒有保底 agent 就會卡在這裡。
        // 回報 rAF 到底有沒有觸發: 分頁在背景時 Chrome 會凍結整條 rendering pipeline,
        // rAF 不跑 -> 用 rAF 畫圖的東西 (Chart.js 動畫等) 根本不會出現。
        // 沒有這個資訊, 背景分頁的空白畫面會被誤診成「block 有 bug」。
        function frames() {
          return new Promise(function(res) {
            var done = false;
            var fire = function(raf) {
              if(done) { return; }
              done = true;
              res(!!raf);
            };
            requestAnimationFrame(function() { requestAnimationFrame(function() { fire(true); }); });
            setTimeout(function() { fire(false); }, 300);
          });
        }

        // 還在跑的 CSS transition / animation / Web Animation, 只算 el 子樹裡的。
        //
        // 為什麼取樣不夠: CSS 的過渡動的是 computed style, DOM 的屬性一動也不動 ——
        // 連續兩次取樣一模一樣, 於是判定「穩定」, 於是回報 blank, 而畫面其實正在
        // 浮現。反過來, 逐格改屬性的過渡 (d3 那種) 不會產生 animation 物件, 只有
        // 取樣看得到。兩者互補, 所以兩個都要。
        //
        // 老實說: makechart 的泡泡圖不屬於前者 —— 它雖然寫了 transition: all, 但
        // duration 是 0s, 那條規則什麼也沒做, 它的漸次浮現是自己的 rAF 迴圈在畫,
        // 由取樣那一半接住。這個函式是為 Chart.js 那類真的用 CSS/WAAPI 的 block 準備的。
        //
        // 限制: getAnimations 只看得到同一份 document。block 是 csscope 掛在本頁的,
        // 所以沒問題; 哪天改成 iframe 就得換成向裡面問。
        function runningAnimations(el) {
          if(!el || typeof document.getAnimations !== 'function') { return 0; }
          var n = 0;
          document.getAnimations().forEach(function(a) {
            if(a.playState !== 'running') { return; }
            var t = a.effect && a.effect.target;
            if(t && (t === el || el.contains(t))) { n++; }
          });
          return n;
        }

        // 等一件事, 但不無限等。
        //
        // 分頁在背景時 Chrome 會凍結 rAF 與 ResizeObserver, 而有些 block 的 init 會等
        // 它們 ( @plotdb/chart 就是等 ResizeObserver ) —— render 的 promise 於是永遠
        // 不 resolve。沒有上限的話 snapshot 整個卡住, 而 inspect 明明有一句專門講
        // 背景分頁的提示, 卻永遠送不到 agent 手上: 它會看到一個不回來的工具, 這比
        // 看到「畫面空白, 因為分頁在背景」還難懂。
        function atMost(p, ms) {
          if(!p) { return Promise.resolve(); }
          return Promise.race([
            Promise.resolve(p).catch(function() {}),
            new Promise(function(r) { setTimeout(r, ms); })
          ]);
        }

        // 「畫面上有東西了嗎」。與 inspect 判 blank 的標準一致 —— 兩邊用不同標準的話,
        // 會出現「settle 說還沒畫完, inspect 說畫好了而且是空的」這種自相矛盾的報告。
        function hasContent(el) {
          if(!el) { return false; }
          if(el.querySelectorAll('path,rect,circle,ellipse,line,polyline,polygon,image,use').length) { return true; }
          if((el.innerText || '').trim()) { return true; }
          return el.querySelectorAll('*').length >= 2;
        }

        // 非 canvas 的畫面簽名。元素數與文字長度抓得到結構變化, 取樣幾個圖元的
        // 幾何抓得到「結構沒變但東西在移動」( d3 的屬性過渡 )。
        // 只取前 8 個 —— 這是每 100ms 跑一次的輪詢, 不是報告。
        function domSignature(el) {
          if(!el) { return ''; }
          var shapes = el.querySelectorAll('path,rect,circle,ellipse,line,polyline,polygon,image,use');
          var parts = [el.querySelectorAll('*').length, shapes.length, (el.innerText || '').length];
          for(var i = 0; i < shapes.length && i < 8; i++) {
            var b = shapes[i].getBoundingClientRect();
            parts.push(Math.round(b.x) + ':' + Math.round(b.y) + ':' +
                       Math.round(b.width) + ':' + Math.round(b.height));
          }
          return parts.join(',');
        }

        // 剛掛上的 block 通常還在非同步載資料, 畫完也還有動畫 (Chart.js 預設 1s),
        // 只等兩個 frame 會抓到空白。所以輪詢到畫面**穩定**再取樣, 不是等「有東西」。
        //
        // 舊版只輪詢到 ratio > 0.005 為止 — 那是為重掛路徑設計的 (空白 -> 出現內容)。
        // 增量更新 (client.data) 沒有空白階段, 第一次輪詢就返回, 於是取樣落在
        // Chart.js 動畫中途、甚至更新之前, 報告就會說 changedRatio: 0 ——
        // 而 prompt 明白告訴 agent「你剛改過卻沒變, 就回去查原因」, 它會去修一個好好的 block。
        //
        // 再舊一版只看 canvas: 沒有 canvas 就直接說 settled，SVG 的 block 等於沒等。
        // 那是最貴的一種漏 —— 空白 + settled: true 讀起來就是「畫壞了」, 而 agent
        // 有寫入權, 它會去修一個好好的圖表 (makechart 的資料事故 #1 就是這樣來的)。
        //
        // 穩定 = 子樹裡沒有還在跑的動畫, 且連續兩次取樣一致, 且不是空白。
        // 「空白不算穩定」是刻意的: 真的空的 block 會用滿 budget 才回報, 代價是
        // 幾秒; 反過來把「還在載」誤判成「畫壞了」的代價是 agent 去改資料。
        // 一直動的 block 永遠不會穩定, 會用滿 budget 並回報 settled: false ——
        // 那種情況本來就該用 pause / seek。
        function settle(el, budget) {
          return frames().then(function(rafFired) {
            var canvas = el && el.querySelector('canvas');
            var deadline = Date.now() + (budget || 0);
            var prev = null;
            var animating = false;
            var poll = function() {
              var s = canvas ? sampleCanvas(canvas) : null;
              // 取樣不到 (跨來源污染) 就沒得判斷, 交給 inspect 去講
              if(canvas && !s) { return {rafFired: rafFired, settled: true}; }
              animating = runningAnimations(el) > 0;
              var cur = s ? s.cells : domSignature(el);
              var painted = s ? s.ratio > 0.005 : hasContent(el);
              var stable = !animating && prev !== null && cur === prev && painted;
              if(stable || Date.now() > deadline) {
                return {rafFired: rafFired, settled: !!stable, animating: animating};
              }
              prev = cur;
              return new Promise(function(r) { setTimeout(r, 100); }).then(poll);
            };
            return poll();
          });
        }

        // block 要拿到什麼資料, 由應用層決定 — sandbox 不看也不碰內容。
        // 沒給 provider 就是空的: block 拿不到任何東西也應該能跑。
        // (composer 換成 nodemgr、makechart 換成 sharehub, 換的都是這個位置)
        function blockData(name) {
          if(typeof self.data !== 'function') { return Promise.resolve({}); }
          return Promise.resolve()
            .then(function() { return self.data(name); })
            .then(function(d) { return (d && typeof d === 'object') ? d : {}; });
        }

        // 把資料交給 block 的第二條路: 呼叫它自己的 interface。
        //
        // 預設那條 (opt.data 進 block, 變動時 client.data 增量更新) 假設 block 是為
        // 這個 host 寫的。早於 host / client 機制存在的 block 不是 —— 它們透過
        // `interface` 對外提供方法, 而那正是 @plotdb/block 本來就設計來讓 block
        // 公開行為的地方 (instance 的 `update` 至今仍標著 TBD)。makechart 的圖表就是
        // 這種: host 拿到 interface 之後自己 `config` / `setRaw`, block 從不讀 opt.data。
        //
        // 判準與 source / list 同一條: 「資料怎麼進 block」是應用層的領域知識,
        // wagent 不知道也不該替它決定 —— 所以開一個窗口, 而不是規定一種做法。
        // 這也讓 host.md 記著「語意有點偏」的 client.data 從唯一的擴充點降級成其中一種。
        //
        // 回 null 表示這條路不適用 (沒給 adapt, 或 block 沒有 interface), 由呼叫者退回預設。
        function adaptData(inst, name) {
          if(!self.adapt || !inst || typeof inst['interface'] !== 'function') { return null; }
          var itf = inst['interface']();
          if(!itf) { return null; }
          return Promise.resolve()
            .then(function() { return blockData(name); })
            .then(function(v) { return self.adapt(itf, v); })
            .then(function() { return {applied: 'adapt'}; });
        }

        // workspace 裡的 block 用 ns 'local' 定址。block 之間要互相引用時:
        //
        //     init: function(opt) {
        //       return opt.manager.from({ns: 'local', name: 'clock'}, opt.root);
        //     }
        //
        // 沒有 ns 的照舊解析成已發佈的資產 (/assets/lib/...)。分開的理由是 local 的
        // block 隨時會被改、也不在任何 URL 上, 跟發佈出去的東西不是同一種東西。
        var LOCAL_NS = 'local';

        function libUrl(o) {
          var def = o.type === 'js' ? 'index.min.js'
            : o.type === 'css' ? 'index.min.css' : 'index.html';
          return '/assets/lib/' + o.name + '/' + (o.version || 'main') + '/' + (o.path || def);
        }

        // 載入並執行 workspace 的 block。每次建新 manager 避免 cache 到舊版原始碼。
        function mount(name, el) {
          var mgr = new window.block.manager({
            registry: {
              lib: libUrl,
              block: {
                url: libUrl,
                // workspace 的 block 不在任何 URL 上 (fs 在 OPFS 裡), 所以走 fetch
                // callback 直接把原始碼交出去 —— 由應用層的 source 解析名字。
                fetch: function(o) {
                  if(o.ns === LOCAL_NS) {
                    if(typeof self.source !== 'function') {
                      return Promise.reject(new Error('no source provider for workspace block: ' + o.name));
                    }
                    return Promise.resolve(self.source(o.name));
                  }
                  return window.fetch(o.url).then(function(r) {
                    if(!r.ok) { throw new Error('load failed: ' + o.url); }
                    return r.text();
                  });
                }
              }
            }
          });
          return Promise.all([
            self.source(name),
            blockData(name)
          ]).then(function(r) {
            var cls = new window.block['class']({
              name: name, version: 'main', code: r[0], manager: mgr
            });
            // opt.data 原封不動來自應用層。sandbox 對它的內容沒有任何假設。
            return cls.create({root: el, data: r[1], host: hostObject()});
          });
        }

        // mode: 'fresh' — 在畫面外以指定尺寸另外掛一份, 截完就丟。
        // 用於 responsive 檢查與可重現的前後對照, 不動使用者當下看到的畫面。
        function snapshotFresh(o) {
          var name = o.target || self.current;
          if(!name) {
            return Promise.resolve({report: {rendered: false, note: 'no block to render'}});
          }
          var w = o.width || 375;
          var h = o.height || 600;
          var holder = document.createElement('div');
          holder.style.cssText = 'position:fixed;left:-99999px;top:0;overflow:hidden;' +
            'width:' + w + 'px;height:' + h + 'px';
          document.body.appendChild(holder);
          var inst = null;
          var prevError = self.lastError;
          self.lastError = null;
          return mount(name, holder)
            .then(function(r) {
              inst = r;
              // fresh 是另外掛一份, 一樣要餵資料, 否則 responsive 檢查看到的是空畫面
              return Promise.resolve(adaptData(r, name)).then(function() { return r; });
            })
            .then(function(r) {
              var c = clientOf(inst);
              return callClient(c, 'pause')
                .then(function() { return o.time != null ? callClient(c, 'seek', o.time) : null; });
            })
            .then(function() { return settle(holder, 2000); })
            .then(function(env) {
              var report = inspect(holder, 'fresh:' + w + 'x' + h + ':' + name, name, env);
              report.mode = 'fresh';
              report.renderedAt = {width: w, height: h};
              return withState(report, clientOf(inst), o);
            })
            .then(function(report) {
              if(!o.image) {
                report.note = NO_IMAGE_NOTE;
                return {report: report};
              }
              return capture(holder, inst)
                .then(function(image) { return {report: report, image: image}; })
                .catch(function(e) {
                  report.imageError = String((e && e.message) || e);
                  return {report: report};
                });
            })
            .catch(function(e) {
              return {report: {
                block: name, mode: 'fresh', rendered: false,
                error: String((e && e.message) || e)
              }};
            })
            .then(function(out) {
              if(inst && typeof inst.detach === 'function') {
                try { inst.detach(); } catch(e) { /* 清掉就好, 失敗不影響結果 */ }
              }
              holder.remove();
              self.lastError = prevError;
              return out;
            });
        }

        // report 的賣點是「便宜」, 但 state 的大小完全由 block 決定 —
        // 一個粒子模擬或大棋盤可以吐出好幾十 KB。超過就截掉並要求 block 自己摘要。
        var STATE_LIMIT = 2000;
        function withState(report, c, o) {
          clientReport(report, c, o);
          if(!c || typeof c.state !== 'function') { return Promise.resolve(report); }
          return callClient(c, 'state').then(function(s) {
            if(s == null) { return report; }
            var str;
            try { str = JSON.stringify(s); } catch(e) { str = null; }
            if(str == null) {
              report.blockStateError = 'state() returned something that is not JSON-serializable';
            } else if(str.length > STATE_LIMIT) {
              report.blockState = str.slice(0, STATE_LIMIT) + '…[truncated]';
              report.blockStateNote = 'state() returned ' + str.length + ' chars and was truncated at ' +
                STATE_LIMIT + '. have state() return a summary (counts, current level, selection), not the raw simulation.';
            } else {
              report.blockState = s;
            }
            return report;
          });
        }

        var NO_IMAGE_NOTE = 'no image was captured (image: false) — you have not seen the actual rendering. call snapshot with image: true before describing how it looks.';

        this.itf = {
          on: function(ev, fn) {
            (self.handlers[ev] = self.handlers[ev] || []).push(fn);
            return self.itf;
          },
          current: function() { return self.current; },
          lang: function() { return self.lang; },
          strings: function() { return self.strings; },
          list: function() { return Promise.resolve().then(function() { return self.list() || []; }); },
          render: function(name, el) {
            self.el = el;
            self.inst = null;
            self.lastError = null;
            var p = mount(name, el).then(function(r) {
              self.inst = r;
              // 走 adapt 的 block 不從 opt.data 讀東西, 掛好要餵一次初始值 ——
              // 少了這行畫面是空的而且沒有任何錯誤, 最會說謊的那種狀況。
              return Promise.resolve(adaptData(r, name)).then(function() {
                emit('rendered', name);
                return r;
              });
            }).catch(function(e) {
              self.lastError = String((e && e.message) || e);
              emit('render-error', {name: name, message: self.lastError});
              throw e;
            });
            // snapshot 要等得到這次渲染 (agent 在 tool loop 中途就會問畫面)
            self.rendering = p;
            return p;
          },
          // 畫面穩定了沒 —— 等進行中的渲染, 再等畫面不動。
          //
          // 為什麼要對外開: 視覺層要做「繪製中」指示的話, 它跟 snapshot 必須看同一個
          // 訊號。接在 render 的 promise 上是不夠的 —— 那只代表掛好了, 圖表的淡入
          // 才正要開始, 指示會在最容易誤判的那一刻剛好消失。
          //
          // 回 {settled, rafFired, animating}。settled: false 不是錯誤, 是「在預算內
          // 沒有停下來」—— 一直動的 block 本來就會這樣。
          settle: function(budget) {
            return atMost(self.rendering, RENDER_WAIT)
              .then(function() { return settle(self.el, budget == null ? 4000 : budget); });
          },
          // 觀察通道 (見 context/project/host.md)。
          // 預設只回便宜的結構化報告 — 「空白 / 沒變化」不需要 vision token 就判斷得出來。
          //  - o.image: 是否出圖
          //  - o.mode:  'live' (預設, 使用者當下看到的) | 'fresh' (畫面外以指定尺寸重繪一份)
          //  - o.width / o.height: fresh 模式的尺寸
          //  - o.time:  有實作 seek 的 block, 跳到指定時間再看
          //  - o.target: 指定 block (預設為目前顯示的那個)
          snapshot: function(o) {
            o = o || {};
            if(o.mode === 'fresh') { return snapshotFresh(o); }

            // live: 只**等**進行中的渲染, 不自己發動重繪。
            //
            // 先前這裡預設會 refresh 一次, 因為那時「什麼時候重畫」還沒有別人負責,
            // agent 在 tool loop 中途問畫面就會看到改動前的版本。現在重繪的決定
            // 已經在應用層 (fs 變更 / 資料變更都由它判斷), 而 fs-change 是在
            // tool 回覆之前就送出的, 所以輪到 snapshot 時應用層早已發動重繪 —
            // 這裡再 refresh 一次只是重掛第二遍, 還會把 client.data 的增量更新
            // 全部作廢 (每次檢查畫面都重建, 動畫與內部狀態照樣丟失)。
            // 要強制重繪仍可傳 refresh: true。
            var ready = Promise.resolve();
            if(o.refresh === true && self.current) { self.itf.refresh(); }
            if(self.rendering) { ready = atMost(self.rendering, RENDER_WAIT); }
            return ready
              .then(function() {
                var c = clientOf(self.inst);
                if(o.time == null) { return null; }
                return callClient(c, 'pause').then(function() { return callClient(c, 'seek', o.time); });
              })
              .then(function() { return settle(self.el, 2000); })
              .then(function(env) {
                var report = inspect(self.el, 'live:' + self.current, self.current, env);
                report.mode = 'live';
                return withState(report, clientOf(self.inst), o);
              })
              .then(function(report) {
                if(!o.image) {
                  // 講明沒有畫面, 否則模型會拿原始碼推測外觀還宣稱「已確認實際呈現」
                  report.note = NO_IMAGE_NOTE;
                  return {report: report};
                }
                return capture(self.el, self.inst)
                  .then(function(image) { return {report: report, image: image}; })
                  .catch(function(e) {
                    report.imageError = String((e && e.message) || e);
                    return {report: report};
                  });
              });
          },
          // 資料變了。有實作 client 的 data 就增量更新, 否則整個重掛。
          //
          // 為什麼走 client 而不是直接改 inst.data: host 不該伸手動別人的內部狀態。
          // 語意上這確實有點偏 —— client 原本是「我對這個 host 回報的能力」,
          // 而餵資料比較像 block 的公開行為。但這是目前唯一合法的擴充點:
          // @plotdb/block 的 instance 已經留了 `update` 的位子 (原始碼裡標著 TBD),
          // 那個做好之後這裡就退位。
          //
          // 注意 inst.data 兩種做法都不會更新 (只有 instance 自己能改)。
          // 目前無害 —— run() 只在 init / destroy 讀它 —— 但這是上限, 不是設計。
          updateData: function() {
            if(!self.current) { return Promise.resolve({applied: 'none'}); }
            var remount = function(why) {
              self.itf.refresh();
              return (self.rendering || Promise.resolve()).catch(function() {})
                .then(function() { return {applied: 'remount', reason: why}; });
            };
            // 應用層給了 adapt 就走它 — 那是它對「資料怎麼進 block」的選擇。
            var a = adaptData(self.inst, self.current);
            if(a) {
              return a.catch(function(e) {
                return remount('adapt threw: ' + String((e && e.message) || e));
              });
            }
            var c = clientOf(self.inst);
            if(!c || typeof c.data !== 'function') { return remount('block has no client.data'); }
            return Promise.resolve()
              .then(function() { return self.data ? self.data(self.current) : {}; })
              .then(function(v) { return callClient(c, 'data', v); })
              .then(function(r) {
                // 更新失敗就退回重掛 —— 不能留著舊畫面假裝更新過了,
                // 「更新了但畫面沒動」是這個專案最會說謊的那種狀況
                if(r && r.error) { return remount('client.data threw: ' + r.error); }
                return {applied: 'client'};
              });
          },
          // show / refresh 廣播 'show' 事件, 由 derived 視覺層決定渲染位置
          show: function(name) {
            self.current = name;
            emit('show', name);
          },
          refresh: function() {
            if(self.current) { emit('show', self.current); }
          }
        };
        return this.itf;
      }
    };
  </script>
</div>
