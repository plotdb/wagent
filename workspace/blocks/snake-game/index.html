<div>
  <div class="snake-ui">
    <div class="header">
      <div class="title">Snake</div>
      <div class="stats">
        <span>Score: <b class="score">0</b></span>
        <span>Best: <b class="best">0</b></span>
        <span>Speed: <b class="speed">120</b> ms</span>
      </div>
    </div>
    <div class="controls">
      <button class="start">Start</button>
      <button class="pause" disabled>Pause</button>
      <button class="reset">Reset</button>
      <label class="grid-label">Grid
        <select class="grid">
          <option value="20" selected>20x20</option>
          <option value="25">25x25</option>
          <option value="30">30x30</option>
        </select>
      </label>
      <label class="tick-label">Tick
        <input type="range" class="tick" min="60" max="300" step="10" value="120"/>
      </label>
    </div>
    <div class="board-wrap">
      <canvas></canvas>
      <div class="overlay hidden">
        <div class="message">Paused</div>
        <div class="overlay-buttons">
          <button class="resume">Resume</button>
          <button class="play-again">Play Again</button>
        </div>
      </div>
    </div>
    <div class="help">使用方向鍵或 WASD 操作；空白鍵開始/暫停，R 重新開始。點擊畫面以聚焦。</div>
  </div>
  <style>
    :scope { display: block; font-family: system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji"; color: #1f2937; }
    .snake-ui { max-width: 560px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .title { font-weight: 700; font-size: 20px; letter-spacing: .5px; }
    .stats { display: flex; gap: 12px; font-size: 14px; color: #374151; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
    .controls button { padding: 6px 10px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; }
    .controls button:disabled { opacity: .5; cursor: not-allowed; }
    .controls label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #4b5563; }
    .controls select, .controls input[type=range] { vertical-align: middle; }
    .board-wrap { position: relative; width: 100%; margin: 6px 0 10px; }
    .board-wrap canvas { width: 100%; height: auto; display: block; border: 1px solid #e5e7eb; background: #f9fafb; border-radius: 8px; }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(255,255,255,.85); border-radius: 8px; border: 1px solid #e5e7eb; }
    .overlay.hidden { display: none; }
    .overlay .message { font-size: 18px; font-weight: 600; color: #111827; }
    .overlay .overlay-buttons { display: flex; gap: 8px; }
    .overlay button { padding: 6px 10px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; }
    .help { font-size: 12px; color: #6b7280; }
  </style>
  <script type="@plotdb/block">
    module.exports = {
      pkg: { name: 'snake-game', version: 'main', description: '貪食蛇小遊戲' },
      init: function(opt) {
        this.root = opt.root;
        var root = opt.root;
        var canvas = root.querySelector('canvas');
        var ctx = canvas.getContext('2d');
        var el = {
          score: root.querySelector('.score'),
          best: root.querySelector('.best'),
          speed: root.querySelector('.speed'),
          start: root.querySelector('.start'),
          pause: root.querySelector('.pause'),
          reset: root.querySelector('.reset'),
          gridSel: root.querySelector('.grid'),
          tickRange: root.querySelector('.tick'),
          overlay: root.querySelector('.overlay'),
          message: root.querySelector('.overlay .message'),
          resume: root.querySelector('.resume'),
          again: root.querySelector('.play-again')
        };
        var state = {
          grid: parseInt(el.gridSel.value, 10) || 20,
          tick: parseInt(el.tickRange.value, 10) || 120,
          running: false,
          timer: null,
          snake: [],
          dir: {x: 1, y: 0},
          nextDir: {x: 1, y: 0},
          apple: {x: 0, y: 0},
          score: 0,
          best: 0,
          lastStepAt: 0
        };
        function getBest() {
          var v = 0; try { v = parseInt(localStorage.getItem('snake.best')||'0', 10) || 0; } catch(e) {}
          return v;
        }
        function setBest(v) {
          try { localStorage.setItem('snake.best', String(v)); } catch(e) {}
        }
        state.best = getBest();
        el.best.textContent = state.best;
        function setCanvasSize() {
          var wrap = root.querySelector('.board-wrap');
          var w = Math.max(260, Math.min(wrap.clientWidth || 560, 560));
          var pxPerCell = Math.max(8, Math.floor(w / state.grid));
          var dim = pxPerCell * state.grid;
          canvas.width = dim;
          canvas.height = dim;
          // style width 100% so it scales nicely; intrinsic size keeps crisp grid
          canvas.style.maxWidth = '100%';
        }
        function initSnake() {
          state.snake = [];
          var mid = Math.floor(state.grid/2);
          state.dir = {x: 1, y: 0};
          state.nextDir = {x: 1, y: 0};
          for (var i=2;i>=0;i--) { state.snake.push({x: mid - i, y: mid}); }
          state.score = 0;
          el.score.textContent = state.score;
        }
        function snakeCellsSet() {
          var set = {};
          for (var i=0;i<state.snake.length;i++) { set[state.snake[i].x + ':' + state.snake[i].y] = true; }
          return set;
        }
        function placeApple() {
          var taken = snakeCellsSet();
          var free = [];
          for (var y=0;y<state.grid;y++) { for (var x=0;x<state.grid;x++) { var k=x+':'+y; if (!taken[k]) free.push({x:x,y:y}); }}
          if (!free.length) return; // filled, player wins in spirit
          var idx = Math.floor(Math.random()*free.length);
          state.apple = free[idx];
        }
        function draw() {
          var w = canvas.width, h = canvas.height;
          var cell = Math.floor(w / state.grid);
          ctx.clearRect(0,0,w,h);
          // background grid pattern
          ctx.fillStyle = '#f3f4f6';
          ctx.fillRect(0,0,w,h);
          ctx.strokeStyle = '#e5e7eb';
          ctx.lineWidth = 1;
          for (var i=1;i<state.grid;i++) {
            var p = i*cell+.5; // crisp lines
            ctx.beginPath(); ctx.moveTo(p,0); ctx.lineTo(p,h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,p); ctx.lineTo(w,p); ctx.stroke();
          }
          // draw apple
          var ax = state.apple.x*cell, ay = state.apple.y*cell;
          var r = Math.floor(cell*0.35);
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(ax+cell/2, ay+cell/2, r, 0, Math.PI*2);
          ctx.fill();
          // small leaf
          ctx.fillStyle = '#10b981';
          ctx.fillRect(ax+cell/2-2, ay+cell/2-r-4, 4, 6);
          // draw snake
          for (var s=0;s<state.snake.length;s++) {
            var seg = state.snake[s];
            var x = seg.x*cell, y = seg.y*cell;
            ctx.fillStyle = s===state.snake.length-1 ? '#2563eb' : '#3b82f6';
            ctx.fillRect(x+1, y+1, cell-2, cell-2);
          }
          // head eye(s)
          var head = state.snake[state.snake.length-1];
          var hx = head.x*cell + cell/2, hy = head.y*cell + cell/2;
          ctx.fillStyle = '#111827';
          var ex = (state.dir.x!==0)? 4*state.dir.x : 0;
          var ey = (state.dir.y!==0)? 4*state.dir.y : 0;
          ctx.beginPath(); ctx.arc(hx+ex-3, hy+ey-3, 2, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(hx+ex+3, hy+ey+3, 2, 0, Math.PI*2); ctx.fill();
        }
        function isOpposite(a, b) { return a.x === -b.x && a.y === -b.y; }
        function step() {
          // apply nextDir at most once per tick
          if (!isOpposite(state.nextDir, state.dir)) state.dir = {x: state.nextDir.x, y: state.nextDir.y};
          var head = state.snake[state.snake.length-1];
          var nx = head.x + state.dir.x;
          var ny = head.y + state.dir.y;
          // wall collision
          if (nx < 0 || ny < 0 || nx >= state.grid || ny >= state.grid) { return gameOver(); }
          // self collision
          for (var i=0;i<state.snake.length;i++) { if (state.snake[i].x===nx && state.snake[i].y===ny) { return gameOver(); } }
          // move
          state.snake.push({x:nx, y:ny});
          if (nx === state.apple.x && ny === state.apple.y) {
            state.score += 1; el.score.textContent = state.score;
            // accelerate slightly every 3 apples
            if (state.score % 3 === 0 && state.tick > 60) { setTick(Math.max(60, state.tick - 5)); }
            placeApple();
          } else {
            state.snake.shift();
          }
          draw();
        }
        function loopStart() {
          if (state.running) return;
          state.running = true;
          el.start.disabled = true; el.pause.disabled = false;
          el.overlay.classList.add('hidden');
          state.timer = setInterval(function(){ step(); }, state.tick);
        }
        function loopPause(showOverlay) {
          if (!state.running) return;
          state.running = false;
          el.start.disabled = false; el.pause.disabled = true;
          if (state.timer) { clearInterval(state.timer); state.timer = null; }
          if (showOverlay) { el.message.textContent = 'Paused'; el.overlay.classList.remove('hidden'); }
        }
        function gameOver() {
          loopPause(false);
          el.message.textContent = 'Game Over';
          el.overlay.classList.remove('hidden');
          if (state.score > state.best) { state.best = state.score; el.best.textContent = state.best; setBest(state.best); }
        }
        function setTick(v) {
          state.tick = v; el.speed.textContent = v;
          el.tickRange.value = v;
          if (state.running) { clearInterval(state.timer); state.timer = setInterval(function(){ step(); }, state.tick); }
        }
        function reset(full) {
          if (state.timer) { clearInterval(state.timer); state.timer = null; }
          state.running = false; el.start.disabled = false; el.pause.disabled = true;
          if (full === true) { setCanvasSize(); }
          initSnake(); placeApple(); draw();
          el.overlay.classList.add('hidden');
        }
        function handleKey(e) {
          var k = e.key || '';
          var nd = null;
          if (k === 'ArrowUp' || k === 'w' || k === 'W') nd = {x:0,y:-1};
          else if (k === 'ArrowDown' || k === 's' || k === 'S') nd = {x:0,y:1};
          else if (k === 'ArrowLeft' || k === 'a' || k === 'A') nd = {x:-1,y:0};
          else if (k === 'ArrowRight' || k === 'd' || k === 'D') nd = {x:1,y:0};
          if (nd) { if (!isOpposite(nd, state.dir)) state.nextDir = nd; e.preventDefault(); return; }
          if (k === ' ' || k === 'Spacebar') { if (state.running) loopPause(true); else loopStart(); e.preventDefault(); }
          if (k === 'p' || k === 'P') { if (state.running) loopPause(true); else loopStart(); }
          if (k === 'r' || k === 'R') { reset(); }
        }
        function setupSwipe() {
          var touch = {x:0,y:0,active:false};
          canvas.addEventListener('touchstart', function(e){ if (!e.touches || !e.touches[0]) return; touch.active=true; touch.x=e.touches[0].clientX; touch.y=e.touches[0].clientY; }, {passive:true});
          canvas.addEventListener('touchend', function(e){ if (!touch.active) return; touch.active=false; var dx=(e.changedTouches&&e.changedTouches[0])? e.changedTouches[0].clientX - touch.x : 0; var dy=(e.changedTouches&&e.changedTouches[0])? e.changedTouches[0].clientY - touch.y : 0; var ax=Math.abs(dx), ay=Math.abs(dy); if (Math.max(ax,ay) < 20) return; var nd = ax>ay? {x:dx>0?1:-1,y:0} : {x:0,y:dy>0?1:-1}; if (!isOpposite(nd, state.dir)) state.nextDir = nd; });
        }
        // UI wiring
        root.setAttribute('tabindex', '0');
        root.addEventListener('keydown', handleKey);
        root.addEventListener('click', function(){ root.focus(); });
        el.start.addEventListener('click', function(){ loopStart(); });
        el.pause.addEventListener('click', function(){ loopPause(true); });
        el.reset.addEventListener('click', function(){ reset(); });
        el.resume.addEventListener('click', function(){ loopStart(); });
        el.again.addEventListener('click', function(){ reset(); loopStart(); });
        el.gridSel.addEventListener('change', function(){ var g = parseInt(el.gridSel.value,10)||20; if (g !== state.grid) { state.grid = g; reset(true); }});
        el.tickRange.addEventListener('input', function(){ setTick(parseInt(el.tickRange.value,10)||120); });
        window.addEventListener('resize', function(){ setCanvasSize(); draw(); });
        setupSwipe();
        // boot
        setCanvasSize();
        reset();
        return Promise.resolve();
      },
      interface: function() {
        var self = this; // share context if needed later
        return {
          start: function(){ var root = self.root; var btn = root && root.querySelector && root.querySelector('.start'); if (btn) btn.click(); },
          pause: function(){ var root = self.root; var btn = root && root.querySelector && root.querySelector('.pause'); if (btn && !btn.disabled) btn.click(); },
          reset: function(){ var root = self.root; var btn = root && root.querySelector && root.querySelector('.reset'); if (btn) btn.click(); }
        };
      }
    };
  </script>
</div>
